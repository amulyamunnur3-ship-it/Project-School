<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎉</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.container{
    text-align:center;
}

h1{
    color:white;
    margin-bottom:20px;
}

.gift{
    width:180px;
    height:180px;
    background:#ff4d6d;
    margin:auto;
    border-radius:10px;
    position:relative;
    cursor:pointer;
    transition:.5s;
    box-shadow:0 10px 20px rgba(0,0,0,.2);
}

.gift:hover{
    transform:scale(1.05);
}

.lid{
    position:absolute;
    width:200px;
    height:40px;
    background:#ff758f;
    left:-10px;
    top:-20px;
    border-radius:8px;
    transition:.8s;
}

.ribbon-v{
    position:absolute;
    width:20px;
    height:180px;
    background:#fff;
    left:80px;
}

.ribbon-h{
    position:absolute;
    width:180px;
    height:20px;
    background:#fff;
    top:80px;
}

.message{
    margin-top:30px;
    color:white;
    opacity:0;
    transform:translateY(20px);
    transition:1s;
}

.message.show{
    opacity:1;
    transform:translateY(0);
}

.message h2{
    font-size:35px;
    margin-bottom:10px;
}

.message p{
    font-size:18px;
}

.confetti{
    position:absolute;
    width:10px;
    height:10px;
    background:red;
    top:-10px;
    animation:fall 4s linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-100vh) rotate(0deg);
    }
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}
</style>

</head>
<body>

<div class="container">

<h1>🎁 Click the Gift 🎁</h1>

<div class="gift" onclick="openGift()">
    <div class="lid" id="lid"></div>
    <div class="ribbon-v"></div>
    <div class="ribbon-h"></div>
</div>

<div class="message" id="message">
    <h2>🎉 Happy Birthday! 🎂</h2>
    <p>
        Wishing you endless happiness, success, good health, and unforgettable moments.
        May all your dreams come true! 💖✨
    </p>
</div>

</div>

<script>
function openGift(){

    document.getElementById("lid").style.transform="rotate(-25deg) translateY(-50px)";
    document.getElementById("message").classList.add("show");

    for(let i=0;i<120;i++){

        let confetti=document.createElement("div");
        confetti.classList.add("confetti");

        confetti.style.left=Math.random()*100+"vw";
        confetti.style.background=
        ["#ff0","#0ff","#f0f","#0f0","#f00","#00f","#fff"][Math.floor(Math.random()*7)];

        confetti.style.animationDuration=(Math.random()*3+2)+"s";
        confetti.style.opacity=Math.random();

        document.body.appendChild(confetti);

        setTimeout(()=>{
            confetti.remove();
        },5000);
    }
}
</script>

</body>
</html>
